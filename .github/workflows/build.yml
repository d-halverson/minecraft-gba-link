name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  ZIG_VERSION: "0.17.0"   # must match what native/README.md documents

jobs:
  natives-macos:
    name: natives (macOS arm64 + x86_64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build macos-aarch64 (native on the runner) and run the tests
        env:
          GBA_DIST_ROOT: ${{ github.workspace }}/dist/natives
        run: |
          cmake --version
          if [ "$(uname -m)" = arm64 ]; then
            native/build_target.sh macos-aarch64 --test
            native/build_target.sh macos-x86_64
          else
            native/build_target.sh macos-x86_64 --test
            native/build_target.sh macos-aarch64
          fi
      - name: Verify architectures and signatures
        run: |
          for p in macos-aarch64 macos-x86_64; do
            lipo -info "dist/natives/$p/libgbacore.dylib"
            codesign --verify --verbose "dist/natives/$p/libgbacore.dylib"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: natives-macos
          path: dist/natives
          if-no-files-found: error

  natives-cross:
    name: natives (Windows x64 + Linux x64 via Zig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Zig ${{ env.ZIG_VERSION }}
        # well-known action; it downloads the official ziglang.org release and verifies its signature
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build linux-x86_64 and run the tests
        env:
          GBA_DIST_ROOT: ${{ github.workspace }}/dist/natives
        run: |
          cmake --version
          zig version
          native/build_target.sh linux-x86_64 --test
      - name: Build windows-x86_64
        env:
          GBA_DIST_ROOT: ${{ github.workspace }}/dist/natives
        run: native/build_target.sh windows-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: natives-cross
          path: dist/natives
          if-no-files-found: error

  mod:
    name: mod (Gradle build + tests)
    runs-on: ubuntu-latest
    needs: [natives-macos, natives-cross]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Download native libraries into dist/natives/<os>-<arch>/
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: dist/natives
      - name: Check all four natives are present
        run: |
          find dist/natives -type f | sort
          for f in macos-aarch64/libgbacore.dylib macos-x86_64/libgbacore.dylib \
                   windows-x86_64/gbacore.dll linux-x86_64/libgbacore.so; do
            test -f "dist/natives/$f" || { echo "missing $f"; exit 1; }
          done
      - name: Gradle build (compiles, runs the unit + native link tests against the linux library)
        working-directory: mod
        env:
          GBALINK_REQUIRE_NATIVE: "1"   # a missing native library fails LinkIntegrationTest instead of skipping it
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Check the jar contains every native
        working-directory: mod
        run: |
          unzip -l build/libs/gbalink-*.jar | grep -c 'natives/.*gbacore' | grep -qx 4
          ls -l build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: mod/build/libs/gbalink-[0-9]*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: resourcepack
          path: mod/build/libs/gbalink-resourcepack-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: mod/build/reports/tests

  determinism:
    name: netplay determinism (${{ matrix.name }})
    needs: [natives-macos, natives-cross]
    runs-on: ${{ matrix.os }}
    # the Intel macOS runner is optional: if it is unavailable the comparison simply has one file fewer
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,   os: ubuntu-latest,    platform: linux-x86_64,   lib: libgbacore.so,    optional: false }
          - { name: macos-aarch64,  os: macos-latest,     platform: macos-aarch64,  lib: libgbacore.dylib, optional: false }
          - { name: macos-x86_64,   os: macos-15-intel,   platform: macos-x86_64,   lib: libgbacore.dylib, optional: true }
          - { name: windows-x86_64, os: windows-latest,   platform: windows-x86_64, lib: gbacore.dll,      optional: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Download the native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          merge-multiple: true
          path: dist/natives
      - name: Run the dual-sim hash check (2 and 3 consoles, 3000 frames), the Game Boy / Game Boy Color hash check (1500 frames) and the linked Game Boy pair hash check (1000 frames, with a reload), fixed ROMs and inputs, virtual RTC
        shell: bash
        run: |
          set -e
          mkdir -p "game/gbalink/natives/${{ matrix.platform }}" out
          cp "dist/natives/${{ matrix.platform }}/${{ matrix.lib }}" "game/gbalink/natives/${{ matrix.platform }}/"
          S=mod/src
          javac --release 25 -d out \
            $S/client/java/com/drew/gba/client/emu/GbaCore.java \
            $S/client/java/com/drew/gba/client/emu/GbaNative.java \
            $S/client/java/com/drew/gba/client/emu/GbaGroup.java \
            $S/client/java/com/drew/gba/client/netplay/NetplaySim.java \
            $S/test/java/com/drew/gba/client/netplay/NetplayHashCheck.java
          java --enable-native-access=ALL-UNNAMED -cp out com.drew.gba.client.netplay.NetplayHashCheck \
            game $S/test/resources/roms/link_pokesim.gba "hashes-${{ matrix.name }}.txt" $S/test/resources/roms
          cat "hashes-${{ matrix.name }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.name }}
          path: hashes-${{ matrix.name }}.txt
          if-no-files-found: error

  determinism-compare:
    name: netplay determinism (compare)
    needs: [determinism]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          path: hashes
      - name: All platforms must print identical hashes
        run: |
          set -e
          ls -l hashes/*/
          files=$(ls hashes/*/hashes-*.txt)
          echo "$files"
          test "$(echo "$files" | wc -l)" -ge 3 || { echo "fewer than three platforms reported"; exit 1; }
          for r in linux-x86_64 macos-aarch64 windows-x86_64; do
            test -f "hashes/hashes-$r/hashes-$r.txt" || { echo "missing required platform $r"; exit 1; }
          done
          ref=hashes/hashes-linux-x86_64/hashes-linux-x86_64.txt
          ok=1
          for f in $files; do
            if diff -u "$ref" "$f"; then echo "same as linux-x86_64: $f"; else echo "DIFFERENT: $f"; ok=0; fi
          done
          test $ok = 1

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [mod, determinism-compare]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "{mod-jar,resourcepack}"
          merge-multiple: true
          path: release
      - name: Check the tag matches the mod version
        id: meta
        run: |
          version="$(sed -n 's/^version=//p' mod/gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match mod version $version (mod/gradle.properties)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # pre-release when the tag has a suffix (v1.0.0-rc1) or the version is 0.x
          case "$version" in
            *-*|0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)       echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Build the Modrinth modpack (.mrpack)
        run: |
          python3 scripts/make_mrpack.py \
            --jar "release/gbalink-${{ steps.meta.outputs.version }}.jar" \
            --repo "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --out "release/gbalink-${{ steps.meta.outputs.version }}.mrpack"
      - name: SHA-256 checksums
        working-directory: release
        run: |
          ls -l
          sha256sum gbalink-* | tee SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: GBA Link ${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/gbalink-*.jar
            release/gbalink-resourcepack-*.zip
            release/gbalink-*.mrpack
            release/SHA256SUMS.txt
